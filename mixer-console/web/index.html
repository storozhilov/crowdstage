<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CrowdStage Mixer Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <div id="panel-grid">
        <section id="broadcast-panel" aria-labelledby="broadcast-panel-title">
          <header class="panel-header">
            <h2 id="broadcast-panel-title">Broadcast</h2>
            <p id="broadcast-status" data-state="connecting" role="status" aria-live="polite">
              Connecting to the broadcast room...
            </p>
          </header>
          <video id="broadcast-video" autoplay playsinline muted></video>
        </section>
        <section id="guests-panel" aria-labelledby="guests-panel-title">
          <header class="panel-header">
            <h2 id="guests-panel-title">Guests</h2>
            <p id="guests-status" data-state="connecting" role="status" aria-live="polite">
              Connecting to the guests room...
            </p>
          </header>
          <video id="guests-video" autoplay playsinline muted></video>
          <div
            id="guests-card-row"
            class="card-row guests-card-row"
            role="group"
            aria-label="Guest streams"
            data-count="0"
          >
            <button
              class="card-row-nav"
              type="button"
              data-role="previous"
              aria-label="Previous guest streams"
              hidden
            >
              &lsaquo;
            </button>
            <div class="card-row-slots" data-role="slots"></div>
            <button
              class="card-row-nav"
              type="button"
              data-role="next"
              aria-label="Next guest streams"
              hidden
            >
              &rsaquo;
            </button>
          </div>
          <p
            id="guests-card-row-status"
            class="visually-hidden"
            data-state="connecting"
            role="status"
            aria-live="polite"
          >
            Connecting to the guests source room...
          </p>
        </section>
        <section id="studio-panel" aria-labelledby="studio-panel-title">
          <header class="panel-header">
            <h2 id="studio-panel-title">Studio</h2>
            <p id="studio-status" data-state="connecting" role="status" aria-live="polite">
              Connecting to the studio room...
            </p>
          </header>
          <div id="studio-camera-sources" class="camera-sources">
            <span class="camera-sources-title">Cameras</span>
            <div
              id="studio-camera-devices"
              class="camera-devices"
              role="group"
              aria-label="Available cameras"
              data-count="0"
            ></div>
            <p
              id="studio-camera-status"
              class="camera-status"
              data-state="loading"
              role="status"
              aria-live="polite"
            >
              Looking for cameras...
            </p>
          </div>
          <div
            id="studio-card-row"
            class="card-row"
            role="group"
            aria-label="Studio streams"
            data-count="0"
          >
            <button
              class="card-row-nav"
              type="button"
              data-role="previous"
              aria-label="Previous studio streams"
              hidden
            >
              &lsaquo;
            </button>
            <div class="card-row-slots" data-role="slots"></div>
            <button
              class="card-row-nav"
              type="button"
              data-role="next"
              aria-label="Next studio streams"
              hidden
            >
              &rsaquo;
            </button>
          </div>
        </section>
        <section id="control-panel" aria-label="Control panel">
          <div id="control-parts">
            <article class="subpanel" data-id="media-mixer">
              <header class="subpanel-header">
                <h2>Media mixer</h2>
                <button
                  class="switch"
                  type="button"
                  role="switch"
                  aria-checked="false"
                  data-state="unknown"
                  data-role="switch"
                >
                  <span class="track"><span class="knob"></span></span>
                  <span class="switch-label" data-role="label">Media mixer state unknown</span>
                </button>
                <span class="badge state" data-role="state">unknown</span>
                <span class="badge health" data-role="health">unknown</span>
              </header>
              <dl class="parameters" data-role="parameters"></dl>
              <p class="subpanel-error" data-role="error"></p>
            </article>
            <article class="subpanel" data-id="mosaic-composer">
              <header class="subpanel-header">
                <h2>Mosaic composer</h2>
                <button
                  class="switch"
                  type="button"
                  role="switch"
                  aria-checked="false"
                  data-state="unknown"
                  data-role="switch"
                >
                  <span class="track"><span class="knob"></span></span>
                  <span class="switch-label" data-role="label">Mosaic composer state unknown</span>
                </button>
                <span class="badge state" data-role="state">unknown</span>
                <span class="badge health" data-role="health">unknown</span>
              </header>
              <dl class="parameters" data-role="parameters"></dl>
              <p class="subpanel-error" data-role="error"></p>
            </article>
          </div>
          <p id="message" role="status" aria-live="polite"></p>
        </section>
      </div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
