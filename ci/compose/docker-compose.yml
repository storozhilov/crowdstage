name: event-platform-dev

services:
  livekit:
    # Pinned to a stable release instead of "latest" so local stands are reproducible.
    # Override with LIVEKIT_VERSION in ci/.env when upgrading deliberately.
    image: "livekit/livekit-server:${LIVEKIT_VERSION:-v1.13.11}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:${LIVEKIT_PORT:-7880}"
      - "127.0.0.1:${LIVEKIT_RTC_TCP_PORT:-7881}:${LIVEKIT_RTC_TCP_PORT:-7881}"
      - "127.0.0.1:${LIVEKIT_RTC_UDP_PORT_START:-50000}-${LIVEKIT_RTC_UDP_PORT_END:-50060}:${LIVEKIT_RTC_UDP_PORT_START:-50000}-${LIVEKIT_RTC_UDP_PORT_END:-50060}/udp"
    environment:
      # LiveKit exposes generated configuration through LIVEKIT_* variables.
      LIVEKIT_PORT: "${LIVEKIT_PORT:-7880}"
      LIVEKIT_RTC_TCP_PORT: "${LIVEKIT_RTC_TCP_PORT:-7881}"
      LIVEKIT_RTC_PORT_RANGE_START: "${LIVEKIT_RTC_UDP_PORT_START:-50000}"
      LIVEKIT_RTC_PORT_RANGE_END: "${LIVEKIT_RTC_UDP_PORT_END:-50060}"
      LIVEKIT_RTC_USE_EXTERNAL_IP: "${LIVEKIT_USE_EXTERNAL_IP:-false}"
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
      LIVEKIT_LOGGING_LEVEL: "${LIVEKIT_LOG_LEVEL:-info}"
    healthcheck:
      # The official image is Alpine-based, so BusyBox wget is available.
      # LiveKit returns 200 from "/" only when the node is ready.
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:$${LIVEKIT_PORT}/\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mosaic-composer:
    # Built locally by ci/mosaic/ensure_image.sh. The stable tag is never pulled
    # from a registry.
    image: "crowdstage-mosaic-composer:dev"
    profiles: ["mosaic"]
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MOSAIC_PORT:-7980}:7980"
    environment:
      MOSAIC_LISTEN_ADDR: ":7980"
      LIVEKIT_URL: "ws://livekit:${LIVEKIT_PORT:-7880}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-devsecret}"
      MOSAIC_SOURCE_ROOM: "${MOSAIC_SOURCE_ROOM:-guests}"
      MOSAIC_TARGET_ROOM: "${MOSAIC_TARGET_ROOM:-mosaic}"
      MOSAIC_IDENTITY: "${MOSAIC_IDENTITY:-mosaic-composer}"

  media-mixer:
    # Built locally by ci/media-mixer/ensure_image.sh. The stable tag is never
    # pulled from a registry. MediaMixer forwards the oldest studio video to
    # the broadcast room, or streams a static picture when none is published.
    image: "crowdstage-media-mixer:dev"
    profiles: ["media-mixer"]
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MEDIA_MIXER_PORT:-7981}:7981"
    environment:
      MEDIA_MIXER_LISTEN_ADDR: ":7981"
      LIVEKIT_URL: "ws://livekit:${LIVEKIT_PORT:-7880}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-devsecret}"
      MEDIA_MIXER_SOURCE_ROOM: "${MEDIA_MIXER_SOURCE_ROOM:-studio}"
      MEDIA_MIXER_TARGET_ROOM: "${MEDIA_MIXER_TARGET_ROOM:-broadcast}"
      MEDIA_MIXER_IDENTITY: "${MEDIA_MIXER_IDENTITY:-media-mixer}"

  bus-monitor-mosaic:
    # Built locally by ci/bus-monitor/ensure_image.sh. The stable tag is never
    # pulled from a registry. This instance monitors the room where
    # MosaicComposer publishes its composed output.
    image: "crowdstage-bus-monitor:dev"
    profiles: ["bus-monitor"]
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BUS_MONITOR_MOSAIC_PORT:-7990}:7990"
    environment:
      BUS_MONITOR_LISTEN_ADDR: ":7990"
      BUS_MONITOR_LIVEKIT_URL: "${BUS_MONITOR_LIVEKIT_URL}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-devsecret}"
      BUS_MONITOR_ROOM: "${MOSAIC_TARGET_ROOM:-mosaic}"
      BUS_MONITOR_IDENTITY: "${BUS_MONITOR_MOSAIC_IDENTITY:-bus-monitor-mosaic}"

  bus-monitor-broadcast:
    # Built locally by ci/bus-monitor/ensure_image.sh. The stable tag is never
    # pulled from a registry. This instance monitors the room where MediaMixer
    # forwards the oldest studio video or streams a static picture.
    image: "crowdstage-bus-monitor:dev"
    profiles: ["bus-monitor"]
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BUS_MONITOR_BROADCAST_PORT:-7992}:7990"
    environment:
      BUS_MONITOR_LISTEN_ADDR: ":7990"
      BUS_MONITOR_LIVEKIT_URL: "${BUS_MONITOR_LIVEKIT_URL}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-devsecret}"
      BUS_MONITOR_ROOM: "${MEDIA_MIXER_TARGET_ROOM:-broadcast}"
      BUS_MONITOR_IDENTITY: "${BUS_MONITOR_BROADCAST_IDENTITY:-bus-monitor-broadcast}"

  mixer-console:
    # Built locally by ci/mixer-console/ensure_image.sh. The stable tag is never
    # pulled from a registry. MosaicComposer and MediaMixer are not hard
    # dependencies: the console reports them as unreachable while they are not
    # deployed, so it has no depends_on entries.
    image: "crowdstage-mixer-console:dev"
    profiles: ["mixer-console"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MIXER_CONSOLE_PORT:-7991}:7991"
    environment:
      MIXER_CONSOLE_LISTEN_ADDR: ":7991"
      MIXER_CONSOLE_MEDIA_MIXER_URL: "http://media-mixer:7981"
      MIXER_CONSOLE_MOSAIC_COMPOSER_URL: "http://mosaic-composer:7980"
      MIXER_CONSOLE_LIVEKIT_URL: "${MIXER_CONSOLE_LIVEKIT_URL}"
      MIXER_CONSOLE_BROADCAST_ROOM: "${MIXER_CONSOLE_BROADCAST_ROOM}"
      MIXER_CONSOLE_GUESTS_ROOM: "${MIXER_CONSOLE_GUESTS_ROOM:-${MOSAIC_TARGET_ROOM:-mosaic}}"
      MIXER_CONSOLE_IDENTITY: "${MIXER_CONSOLE_IDENTITY:-mixer-console}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-devsecret}"
