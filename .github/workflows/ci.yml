name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application
        run: ./ci/build.sh

      - name: Start development stand
        run: ./ci/dev.sh up --wait

      - name: Run tests
        run: ./ci/run_tests.sh

      - name: Stop development stand
        if: always()
        run: ./ci/dev.sh down
