name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test CI library helpers
        run: ./ci/test_lib.sh

      - name: Build applications
        run: ./ci/build.sh

      - name: Build MosaicComposer image
        run: ./ci/mosaic/ensure_image.sh

      - name: Start development stand
        run: ./ci/dev.sh up --wait

      - name: Deploy MosaicComposer
        run: ./ci/mosaic/deploy.sh

      - name: Run tests
        run: ./ci/run_tests.sh

      - name: Test MosaicComposer REST harness scripts
        run: ./ci/mosaic/test_rest.sh

      - name: Uninstall MosaicComposer
        if: always()
        run: ./ci/mosaic/uninstall.sh

      - name: Stop development stand
        if: always()
        run: ./ci/dev.sh down
