name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application
        run: ./ci/build.sh

      - name: Run tests
        run: ./ci/run_tests.sh

  dev-stand:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start development stand
        run: ./ci/dev.sh up

      - name: Say hello
        run: echo "Hello from CI"

      - name: Stop development stand
        if: always()
        run: ./ci/dev.sh down
