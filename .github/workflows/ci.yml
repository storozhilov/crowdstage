name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test CI library helpers
        run: ./ci/test_lib.sh

      - name: Build applications
        run: ./ci/build.sh

      - name: Build MosaicComposer image
        run: ./ci/mosaic/ensure_image.sh

      - name: Build MediaMixer image
        run: ./ci/media-mixer/ensure_image.sh

      - name: Build BusMonitor image
        run: ./ci/bus-monitor/ensure_image.sh

      - name: Start development stand
        run: ./ci/dev.sh up --wait

      - name: Deploy MosaicComposer
        run: ./ci/mosaic/deploy.sh

      - name: Deploy MediaMixer
        run: ./ci/media-mixer/deploy.sh

      - name: Deploy mosaic BusMonitor
        run: ./ci/bus-monitor/mosaic/deploy.sh

      - name: Deploy broadcast BusMonitor
        run: ./ci/bus-monitor/broadcast/deploy.sh

      - name: Run Go tests
        run: ./ci/run_tests.sh

      - name: Run mosaic BusMonitor tests
        run: ./ci/bus-monitor/mosaic/test.sh

      - name: Run broadcast BusMonitor tests
        run: ./ci/bus-monitor/broadcast/test.sh

      - name: Test MosaicComposer REST harness scripts
        run: ./ci/mosaic/test_rest.sh

      - name: Test MosaicComposer guest script
        run: ./ci/mosaic/test_run_guest.sh

      - name: Test MediaMixer studio publisher script
        run: ./ci/media-mixer/test_run_studio.sh

      - name: Test MediaMixer REST harness scripts
        run: ./ci/media-mixer/test_rest.sh

      - name: Uninstall mosaic BusMonitor
        if: always()
        run: ./ci/bus-monitor/mosaic/uninstall.sh

      - name: Uninstall broadcast BusMonitor
        if: always()
        run: ./ci/bus-monitor/broadcast/uninstall.sh

      - name: Uninstall MosaicComposer
        if: always()
        run: ./ci/mosaic/uninstall.sh

      - name: Uninstall MediaMixer
        if: always()
        run: ./ci/media-mixer/uninstall.sh

      - name: Stop development stand
        if: always()
        run: ./ci/dev.sh down
